<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayesha Spa & Wellness</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
}

body{
  color:#fff;

  /* BACKGROUND PHOTO */
  background-image:
    linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.70)),
    url("spa-bg.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

/* MAIN */
.container{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding:25px 18px 35px;
}

/* TOP LABEL */
.label{
  width:max-content;
  max-width:100%;
  margin:0 auto 20px;

  padding:9px 20px;
  border-radius:30px;

  background:rgba(25,25,25,.65);
  border:1px solid rgba(220,180,90,.55);

  color:#f4d58c;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

/* TITLE */
.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  margin:0;

  font-family:Georgia,serif;
  font-size:36px;
  line-height:1.1;

  color:#fff;
  text-shadow:0 3px 12px #000;
}

.header p{
  margin:10px 0 0;

  font-size:14px;
  color:#eee;
  letter-spacing:.5px;
}

/* CONTACT CARD */
.contact-card{
  background:rgba(0,0,0,.62);

  border:1px solid rgba(255,255,255,.18);
  border-radius:25px;

  padding:28px 18px 30px;

  text-align:center;

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  box-shadow:0 12px 35px rgba(0,0,0,.55);
}

/* TELEGRAM */
.telegram-icon{
  width:62px;
  height:62px;

  margin:0 auto 13px;

  border-radius:50%;

  background:#229ED9;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:29px;

  box-shadow:0 5px 20px rgba(34,158,217,.35);
}

.contact-card h2{
  margin:0;

  font-size:23px;
  color:#fff;
}

.contact-card p{
  margin:8px 0 19px;

  color:#d0d0d0;
  font-size:14px;
}

/* BUTTON */
.telegram-btn{
  display:inline-block;

  padding:14px 30px;

  border-radius:35px;

  background:#229ED9;
  color:#fff;

  text-decoration:none;

  font-size:15px;
  font-weight:bold;

  box-shadow:0 5px 18px rgba(34,158,217,.35);
}

.telegram-btn:active{
  transform:scale(.96);
}

/* SERVICES */
.services-title{
  text-align:center;

  margin:30px 0 16px;

  font-family:Georgia,serif;
  font-size:24px;

  text-shadow:0 3px 10px #000;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.service{
  min-height:115px;

  padding:15px 8px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:rgba(0,0,0,.62);

  border:1px solid rgba(255,255,255,.16);
  border-radius:20px;

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);

  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.service span{
  font-size:28px;
  margin-bottom:9px;
}

.service strong{
  color:#fff;
  font-size:14px;
}

/* FOOTER */
.footer{
  text-align:center;

  margin-top:24px;

  color:#ddd;
  font-size:12px;

  text-shadow:0 2px 7px #000;
}

/* MOBILE */
@media(max-width:360px){

  .container{
    padding-left:14px;
    padding-right:14px;
  }

  .header h1{
    font-size:31px;
  }

  .label{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="label">
    ✦ PREMIUM SPA & WELLNESS
  </div>

  <div class="header">
    <h1>Ayesha Spa<br>& Wellness</h1>
    <p>Relax • Refresh • Rejuvenate</p>
  </div>


  <div class="contact-card">

    <div class="telegram-icon">✈</div>

    <h2>Contact Telegram</h2>

    <p>For appointment & booking</p>

    <a
      class="telegram-btn"
      href="https://t.me/AYESHA_MANNUR"
      target="_blank"
      rel="noopener">
      CLICK HERE
    </a>

  </div>


  <h2 class="services-title">
    Our Services
  </h2>


  <div class="services">

    <div class="service">
      <span>💆</span>
      <strong>Relaxing Massage</strong>
    </div>

    <div class="service">
      <span>🌿</span>
      <strong>Wellness Massage</strong>
    </div>

    <div class="service">
      <span>✨</span>
      <strong>Aromatherapy</strong>
    </div>

    <div class="service">
      <span>🧖</span>
      <strong>Spa Treatment</strong>
    </div>

  </div>


  <div class="footer">
    Appointment required • Contact us on Telegram
  </div>

</div>

</body>
</html>
