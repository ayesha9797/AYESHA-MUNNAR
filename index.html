<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayesha Spa & Wellness</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  color:#fff;

  /* ONLY BACKGROUND CHANGED */
  background:
    radial-gradient(circle at 50% 15%, rgba(103,76,35,.28), transparent 35%),
    radial-gradient(circle at 15% 75%, rgba(65,48,25,.22), transparent 35%),
    radial-gradient(circle at 90% 65%, rgba(70,52,25,.18), transparent 35%),
    linear-gradient(135deg,#050505 0%,#11100d 45%,#050505 100%);

  background-attachment:fixed;
}

/* MAIN */
.container{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding:26px 18px 32px;
}

/* HEADER */
.header{
  text-align:center;
  padding:10px 5px 25px;
}

.header h1{
  margin:0;
  font-size:29px;
  font-weight:700;
  color:#fff;
}

.header p{
  margin:8px 0 0;
  font-size:14px;
  color:#aaa;
}

/* TELEGRAM CARD */
.telegram-box{
  background:#111;
  border:1px solid #252525;
  border-radius:25px;
  padding:28px 18px 30px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.75);
}

/* TELEGRAM ICON */
.telegram-icon{
  width:68px;
  height:68px;
  border-radius:50%;
  margin:0 auto 16px;
  background:#229ED9;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  color:white;

  box-shadow:0 5px 20px rgba(34,158,217,.25);
}

.telegram-box h2{
  margin:0;
  font-size:23px;
  color:#fff;
}

.telegram-box p{
  margin:8px 0 19px;
  font-size:14px;
  color:#999;
}

/* CLICK HERE */
.click{
  display:inline-block;
  padding:14px 32px;
  background:#229ED9;
  color:white;
  text-decoration:none;
  border-radius:30px;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(34,158,217,.28);
}

.click:active{
  transform:scale(.97);
}

/* SERVICES */
.services-title{
  text-align:center;
  margin:30px 0 17px;
  font-size:23px;
  color:#fff;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.service{
  min-height:128px;
  background:#111;
  border:1px solid #252525;
  border-radius:20px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  box-shadow:0 8px 24px rgba(0,0,0,.65);
}

.service span{
  font-size:29px;
  margin-bottom:10px;
}

.service strong{
  font-size:14px;
  color:#fff;
}

/* FOOTER */
.bottom{
  text-align:center;
  margin-top:27px;
  color:#777;
  font-size:12px;
}

/* MOBILE */
@media(max-width:360px){

  .container{
    padding-left:14px;
    padding-right:14px;
  }

  .header h1{
    font-size:26px;
  }

  .telegram-box{
    padding:25px 14px 28px;
  }

  .services{
    gap:10px;
  }

  .service{
    min-height:120px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Ayesha Spa & Wellness</h1>
    <p>Relax • Refresh • Rejuvenate</p>
  </div>

  <div class="telegram-box">

    <div class="telegram-icon">✈</div>

    <h2>Contact Telegram</h2>

    <p>For appointment & booking</p>

    <a
      class="click"
      href="https://t.me/AYESHA_MANNUR"
      target="_blank"
      rel="noopener">
      CLICK HERE
    </a>

  </div>

  <h2 class="services-title">Our Services</h2>

  <div class="services">

    <div class="service">
      <span>💆</span>
      <strong>Relaxing Massage</strong>
    </div>

    <div class="service">
      <span>🌿</span>
      <strong>Wellness Massage</strong>
    </div>

    <div class="service">
      <span>✨</span>
      <strong>Aromatherapy</strong>
    </div>

    <div class="service">
      <span>🧖</span>
      <strong>Spa Treatment</strong>
    </div>

  </div>

  <div class="bottom">
    Appointment required • Contact us on Telegram
  </div>

</div>

</body>
</html>
