<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayesha Spa & Wellness</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f1ec;
  color:#29231f;
}

.container{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:25px 18px 35px;
}

.header{
  text-align:center;
  padding:15px 10px 20px;
}

.header h1{
  margin:0;
  font-size:28px;
  letter-spacing:.5px;
}

.header p{
  margin:7px 0 0;
  color:#756b63;
  font-size:14px;
}

.telegram-box{
  background:white;
  border-radius:20px;
  padding:22px 18px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  margin-bottom:22px;
}

.telegram-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#229ED9;
  color:white;
  font-size:28px;
  font-weight:bold;
}

.telegram-box h2{
  margin:5px 0 6px;
  font-size:21px;
}

.telegram-box p{
  margin:0 0 15px;
  color:#777;
  font-size:14px;
}

.click{
  display:inline-block;
  text-decoration:none;
  background:#229ED9;
  color:white;
  padding:13px 25px;
  border-radius:30px;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 4px 12px rgba(34,158,217,.25);
}

.services-title{
  text-align:center;
  margin:25px 0 14px;
  font-size:22px;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.service{
  background:white;
  border-radius:15px;
  padding:17px 10px;
  text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
  font-size:14px;
  font-weight:bold;
}

.service span{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

.bottom{
  text-align:center;
  margin-top:25px;
  color:#81776f;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Ayesha Spa & Wellness</h1>
    <p>Relax • Refresh • Rejuvenate</p>
  </div>

  <div class="telegram-box">

    <div class="telegram-icon">✈</div>

    <h2>Contact Telegram</h2>

    <p>For appointment & booking</p>

    <a class="click"
       href="https://t.me/AYESHA_MANNUR"
       target="_blank">
       CLICK HERE
    </a>

  </div>

  <h2 class="services-title">Our Services</h2>

  <div class="services">

    <div class="service">
      <span>💆</span>
      Relaxing Massage
    </div>

    <div class="service">
      <span>🌿</span>
      Wellness Massage
    </div>

    <div class="service">
      <span>✨</span>
      Aromatherapy
    </div>

    <div class="service">
      <span>🧖</span>
      Spa Treatment
    </div>

  </div>

  <div class="bottom">
    Appointment required • Contact us on Telegram
  </div>

</div>

</body>
</html>
