<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deepti Spa</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f1ec;
  color:#29231f;
}
.container{
  max-width:480px;
  margin:auto;
  padding:60px 20px;
  text-align:center;
}
.card{
  background:white;
  padding:40px 25px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}
.logo{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:50%;
  background:#29231f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}
h1{
  font-size:36px;
  margin:20px 0 10px;
}
p{
  color:#666;
  line-height:1.6;
}
.button{
  display:block;
  margin-top:30px;
  padding:16px;
  background:#229ed9;
  color:white;
  text-decoration:none;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
}
.username{
  margin-top:18px;
  color:#888;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="logo">DS</div>

    <h1>Deepti Spa</h1>

    <p>
      Welcome to Deepti Spa.<br>
      For information and appointments,
      contact us on Telegram.
    </p>

    <a class="button"
       href="https://t.me/Deepti_reddy_56"
       target="_blank">
       Contact on Telegram
    </a>

    <div class="username">
      @Deepti_reddy_56
    </div>

  </div>
</div>

</body>
</html>
